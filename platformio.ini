; Waveshare ESP32-C6-Zero (ESP32-C6FH4, 4 MB flash, USB-Serial/JTAG).
; Stock PlatformIO "espressif32" cannot build Arduino for the C6, so this
; uses the pioarduino stable platform, which tracks Arduino-ESP32 3.x.

[platformio]
default_envs = waveshare_esp32_c6_zero

[env:waveshare_esp32_c6_zero]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = waveshare_esp32_c6_zero
framework = arduino
monitor_speed = 115200

; The module is an ESP32-C6FH4: 4 MB flash. Repeated here so an upstream
; manifest cannot override the local boards/waveshare_esp32_c6_zero.json.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

; Arduino-ESP32 3.x: USB_MODE 1 is the on-chip USB-Serial/JTAG controller,
; which is the USB-C port on this board. USB_MODE 0 is USB-OTG/TinyUSB,
; and the C6 does not have that peripheral. CDC on boot makes Serial
; use that USB port.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
